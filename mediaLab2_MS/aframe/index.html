<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Lab2 - VR application</title>
    <meta name="description" content="Basic example for Point Cloud component."></meta>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="js/aframe-pointcloud-component.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="groundTexture" src="https://cdn.aframe.io/a-painter/images/floor.jpg">
        <img id="skyTexture" src="https://cdn.aframe.io/a-painter/images/sky.jpg">
      </a-assets>

      <a-plane src="#groundTexture" rotation="-90 0 0" height="100" width="100" roughness="0.9" shader="standard" material="repeat: 30 30"></a-plane>
      <a-light type="ambient" color="#74918c"></a-light>
      <a-light type="point" intensity="2.2" position="3 3 3"></a-light>
      <a-sky height="2048" radius="30" src="#skyTexture" theta-length="90" width="2048" material="color: #000c12"></a-sky>
      
      <a-entity camera look-controls wasd-controls position="0 1.6 0">
        <a-entity cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
      </a-entity>
      
      <a-pointcloud 
        id="statue"
        scale="0.1 0.1 0.1" 
        position="0 0.5 -4" 
        rotation="-90 45 0" 
        src="url(sculpt.ply)" 
        size="0.01">
      </a-pointcloud>
      
      <a-entity position="2.5 1.5 -3" rotation="0 -20 0">
        
        <a-plane color="#022625" width="1.5" height="2.5" position="0 0.45 0"></a-plane>
        
        <a-text value="CONTROLS" color="#FFFFFF" width="3" position="0 1.5 0" align="center"></a-text>

        <a-box class="clickable" id="btn-rotLeft" color="#660363" width="0.6" height="0.25" depth="0.1" position="-0.35 1.1 0">
          <a-text value="Left" color="#FFFFFF" width="2" position="0 0 0.06" align="center"></a-text>
        </a-box>
        
        <a-box class="clickable" id="btn-rotRight" color="#660363" width="0.6" height="0.25" depth="0.1" position="0.35 1.1 0">
          <a-text value="Right" color="#FFFFFF" width="2" position="0 0 0.06" align="center"></a-text>
        </a-box>

        <a-box class="clickable" id="btn-zoomIn" color="#420366" width="0.6" height="0.25" depth="0.1" position="-0.35 -0.1 0">
          <a-text value="Zoom In" color="#FFFFFF" width="2" position="0 0 0.06" align="center"></a-text>
        </a-box>
        
        <a-box class="clickable" id="btn-zoomOut" color="#420366" width="0.6" height="0.25" depth="0.1" position="0.35 -0.1 0">
          <a-text value="Zoom Out" color="#FFFFFF" width="2" position="0 0 0.06" align="center"></a-text>
        </a-box>

        <a-box class="clickable" id="btn-forward" color="#660321" width="0.6" height="0.25" depth="0.1" position="-0.35 0.7 0">
          <a-text value="Forward" color="#FFFFFF" width="2" position="0 0 0.06" align="center"></a-text>
        </a-box>
        
        <a-box class="clickable" id="btn-back" color="#660321" width="0.6" height="0.25" depth="0.1" position="0.35 0.7 0">
          <a-text value="Back" color="#FFFFFF" width="2" position="0 0 0.06" align="center"></a-text>
        </a-box>
        
        <a-box class="clickable" id="btn-left" color="#660321" width="0.6" height="0.25" depth="0.1" position="-0.35 0.3 0">
          <a-text value="Left" color="#FFFFFF" width="2" position="0 0 0.06" align="center"></a-text>
        </a-box>
 
        <a-box class="clickable" id="btn-right" color="#660321" width="0.6" height="0.25" depth="0.1" position="0.35 0.3 0">
          <a-text value="Right" color="#FFFFFF" width="2" position="0 0 0.06" align="center"></a-text>
        </a-box>
        
        <a-box class="clickable" id="btn-toggle" color="#2d2875" width="0.6" height="0.25" depth="0.1" position="-0.35 -0.5 0">
          <a-text value="Toggle" color="#FFFFFF" width="2" position="0 0 0.06" align="center"></a-text>
        </a-box>
        
        <a-box class="clickable" id="btn-reset" color="#4a0f0f" width="0.6" height="0.25" depth="0.1" position="0.35 -0.5 0">
          <a-text value="Reset" color="#FFFFFF" width="2" position="0 0 0.06" align="center"></a-text>
        </a-box>
        
      </a-entity>
    </a-scene>

    <script src="js/control.js"></script>
  </body>
</html>
